# Builds the package for every Apple platform it declares support for, through
# the Xcode build system, and runs its tests wherever a runner can boot the
# destination. This package supports Apple platforms only, so this one
# workflow is the whole matrix.

name: Apple Platforms

# Pushes only fire on the branches git-flow keeps around; feature branches are
# covered by the pull_request trigger. Only a change that can alter what is
# built here runs it: a commit to the README runs nothing.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: &paths
      - Sources/**
      - Tests/**
      - Package.swift
      - .github/workflows/apple-platforms.yml
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform.name }} · ${{ matrix.xcode.name }}
    runs-on: ${{ matrix.xcode.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ matrix.xcode.developer_dir }}
    strategy:
      fail-fast: false
      # Two axes, crossed. The Xcode axis is the newest patch of each Swift
      # minor the package supports, and it moves the platform SDKs along with
      # the compiler. An entry names its runner too, because no one image
      # carries every Xcode: Xcode 27 is only on `xcode-27`, a preview of the
      # macOS 27 image, and nothing older is on it. Swift 6.2 ends with Xcode
      # 26.3; Swift 6.3 starts with Xcode 26.4.
      #
      # Device and simulator are separate SDKs and target triples, so they fail
      # independently. The watchOS device row is the only one that compiles the
      # arm64_32 slice, where `Int` is 32 bits; nothing can run it, so it stops
      # after the build. A row that can run tests names its destination
      # directly (macOS, Mac Catalyst) or by simulator runtime, resolved below
      # against whatever device the image carries so a renamed device does not
      # rot the matrix.
      matrix:
        xcode:
          - name: "Swift 6.2.4"
            runner: macos-26
            developer_dir: /Applications/Xcode_26.3.app/Contents/Developer
          - name: "Swift 6.3.3"
            runner: macos-26
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
          - name: "Swift 6.4"
            runner: xcode-27
            developer_dir: /Applications/Xcode_27.0.app/Contents/Developer
        platform:
          - name: "macOS"
            destination: "generic/platform=macOS"
            test_destination: "platform=macOS"
          - name: "Mac Catalyst"
            destination: "generic/platform=macOS,variant=Mac Catalyst"
            test_destination: "platform=macOS,variant=Mac Catalyst"
          - name: "iOS"
            destination: "generic/platform=iOS"
          - name: "iOS Simulator"
            destination: "generic/platform=iOS Simulator"
            simulator_runtime: iOS
            simulator_sdk: iphonesimulator
          - name: "tvOS"
            destination: "generic/platform=tvOS"
          - name: "tvOS Simulator"
            destination: "generic/platform=tvOS Simulator"
            simulator_runtime: tvOS
            simulator_sdk: appletvsimulator
          - name: "watchOS"
            destination: "generic/platform=watchOS"
          - name: "watchOS Simulator"
            destination: "generic/platform=watchOS Simulator"
            simulator_runtime: watchOS
            simulator_sdk: watchsimulator
          - name: "visionOS"
            destination: "generic/platform=visionOS"
          # visionOS answers to xrOS in CoreSimulator's runtime identifiers.
          - name: "visionOS Simulator"
            destination: "generic/platform=visionOS Simulator"
            simulator_runtime: xrOS
            simulator_sdk: xrsimulator
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version

      # Release is the library as a client gets it, built without testability
      # so the optimizer sees what ships. Debug is where `@testable import`
      # works, which every test target here relies on, so it is the only
      # configuration whose tests are built and run.
      - name: xcodebuild build (Release)
        run: |
          xcodebuild build \
            -scheme KeychainKit \
            -destination '${{ matrix.platform.destination }}' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      - name: xcodebuild build-for-testing (Debug)
        run: |
          xcodebuild build-for-testing \
            -scheme KeychainKit \
            -destination '${{ matrix.platform.destination }}' \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      # macOS and Mac Catalyst name themselves; a simulator row states its
      # runtime and this picks a device out of the image's copy of it. An image
      # carries one runtime per Xcode it has, so the lookup is held to the
      # version of this Xcode's own simulator SDK (26.2 -> iOS-26-2) rather
      # than taking whichever runtime the list happens to start with. A device
      # row leaves the variable empty and the test step drops out.
      - name: Resolve the test destination
        run: |
          if [ -n "${{ matrix.platform.simulator_runtime }}" ]; then
            version=$(xcrun --sdk "${{ matrix.platform.simulator_sdk }}" --show-sdk-version | tr . -)
            udid=$(xcrun simctl list devices available --json | jq -er \
              --arg prefix "com.apple.CoreSimulator.SimRuntime.${{ matrix.platform.simulator_runtime }}-$version" \
              '[.devices | to_entries[] | select(.key | startswith($prefix)) | .value[]][0].udid')
            echo "TEST_DESTINATION=id=$udid" >> "$GITHUB_ENV"
          else
            echo "TEST_DESTINATION=${{ matrix.platform.test_destination }}" >> "$GITHUB_ENV"
          fi

      # The integration suites create a temporary file-based keychain, which
      # only macOS has; they are compiled out everywhere else, so the other
      # rows run the pure request-building and parsing tests alone.
      - name: xcodebuild test-without-building (Debug)
        if: env.TEST_DESTINATION
        run: |
          xcodebuild test-without-building \
            -scheme KeychainKit \
            -destination "$TEST_DESTINATION" \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
